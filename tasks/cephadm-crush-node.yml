---
- name: "Get OSD IDs on {{ _crush_host }}"
  ansible.builtin.command: >
    ceph osd ls-tree {{ _crush_host | split('.') | first }} --format json
  register: _host_osd_ids
  changed_when: false
  failed_when: false

- name: "Skip crush update if no OSDs found: {{ _crush_host }}"
  ansible.builtin.meta: noop
  when: (_host_osd_ids.stdout | default('[]') | from_json | length) == 0

- name: "Get current CRUSH location for {{ _crush_host }}"
  ansible.builtin.command: >
    ceph osd find {{ _host_osd_ids.stdout | from_json | first }} --format json
  register: _osd_find
  changed_when: false
  when: (_host_osd_ids.stdout | default('[]') | from_json | length) > 0

- name: "Build desired CRUSH location for {{ _crush_host }}"
  ansible.builtin.set_fact:
    _desired_crush: >-
      {%- set loc = {'root': 'default'} -%}
      {%- if hostvars[_crush_host].ceph_osd_chassis is defined -%}
        {%- set _ = loc.update({'chassis': hostvars[_crush_host].ceph_osd_chassis}) -%}
      {%- endif -%}
      {%- if hostvars[_crush_host].ceph_osd_rack is defined -%}
        {%- set _ = loc.update({'rack': hostvars[_crush_host].ceph_osd_rack}) -%}
      {%- endif -%}
      {%- if hostvars[_crush_host].ceph_osd_row is defined -%}
        {%- set _ = loc.update({'row': hostvars[_crush_host].ceph_osd_row}) -%}
      {%- endif -%}
      {%- if hostvars[_crush_host].ceph_osd_room is defined -%}
        {%- set _ = loc.update({'room': hostvars[_crush_host].ceph_osd_room}) -%}
      {%- endif -%}
      {{ loc }}
  when: (_host_osd_ids.stdout | default('[]') | from_json | length) > 0

- name: "Check if CRUSH location needs update for {{ _crush_host }}"
  ansible.builtin.set_fact:
    _crush_needs_update: >-
      {%- set current = (_osd_find.stdout | from_json).crush_location | default({}) -%}
      {%- set current_filtered = {} -%}
      {%- for k, v in current.items() -%}
        {%- if k != 'host' -%}
          {%- set _ = current_filtered.update({k: v}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ current_filtered != _desired_crush }}
  when: (_host_osd_ids.stdout | default('[]') | from_json | length) > 0

- name: "Update CRUSH location for {{ _crush_host }}"
  ansible.builtin.command: >
    ceph osd crush move {{ _crush_host | split('.') | first }}
    {% for k, v in _desired_crush.items() %}{{ k }}={{ v }} {% endfor %}
  when:
    - (_host_osd_ids.stdout | default('[]') | from_json | length) > 0
    - _crush_needs_update | default(false) | bool
  changed_when: true
