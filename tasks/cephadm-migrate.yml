---
# -----------------------------------------------------------------------
# Pre-flight checks — run once on bootstrap node
# -----------------------------------------------------------------------

- name: "Mute health checks that are expected during migration"
  ansible.builtin.shell: |
    ceph health mute CEPHADM_STRAY_HOST || true
    ceph health mute CEPHADM_STRAY_DAEMON || true
    ceph health mute CEPHADM_FAILED_DAEMON || true
    ceph health mute CEPHADM_APPLY_SPEC_FAIL || true
  changed_when: true

- name: "Migration: check cluster health before starting"
  ansible.builtin.command: ceph health --format json
  register: _preflight_health
  changed_when: false
  run_once: true
  delegate_to: "{{ ceph_bootstrap_node }}"

- name: "Migration: assert cluster is healthy"
  ansible.builtin.assert:
    that: (_preflight_health.stdout | from_json).status == 'HEALTH_OK'
    fail_msg: >-
      Cluster health is {{ (_preflight_health.stdout | from_json).status }}.
      Resolve cluster issues before migrating.
  run_once: true
  delegate_to: "{{ ceph_bootstrap_node }}"

- name: "Migration: check all OSDs are up"
  ansible.builtin.command: ceph osd stat --format json
  register: _osd_stat
  changed_when: false
  run_once: true
  delegate_to: "{{ ceph_bootstrap_node }}"

- name: "Migration: assert all OSDs are up"
  ansible.builtin.assert:
    that: >-
      (_osd_stat.stdout | from_json).num_up_osds ==
      (_osd_stat.stdout | from_json).num_osds
    fail_msg: >-
      Not all OSDs are up: {{ (_osd_stat.stdout | from_json).num_up_osds }} /
      {{ (_osd_stat.stdout | from_json).num_osds }}.
  run_once: true
  delegate_to: "{{ ceph_bootstrap_node }}"

- name: "Make sure the fsid is lowercase in ceph.conf -- seems to be problems if not"
  community.general.ini_file:
    path: /etc/ceph/ceph.conf
    section: global
    option: fsid
    value: "{{ ceph_uuid | lower }}"
    mode: "0644"

- name: "Make sure it thinks the host is ready"
  ansible.builtin.command: "cephadm prepare-host"
  changed_when: false

- name: "Pull in legacy configuration"
  ansible.builtin.command: "ceph config assimilate-conf -i /etc/ceph/ceph.conf"
  changed_when: true
  when:
    - inventory_hostname == ceph_bootstrap_node
    - _needs_mon_adopt | default(false)


# -----------------------------------------------------------------------
# UID Migration
# -----------------------------------------------------------------------

- name: Get ceph uid
  ansible.builtin.user:
    name: ceph
  register: ceph_user_info

- name: Renumber ceph uid  # noqa: command-instead-of-module
  when: ceph_user_info.uid != 167
  ansible.builtin.shell: |
    systemctl stop ceph\*.service ceph\*.target
    usermod -u 167 ceph
    groupmod -g 167 ceph
    chown -R ceph:ceph /etc/ceph /var/lib/ceph /var/log/ceph /var/run/ceph
    sleep 1
    systemctl restart udev
    sleep 1
    udevadm control --reload-rules
    sleep 1
    udevadm trigger
    sleep 1
    find /dev -uid {{ ceph_user_info.uid }} -exec chown ceph:ceph {} +
  changed_when: true

- name: Make sure monitor is started  # noqa: command-instead-of-module
  when:
    - ceph_user_info.uid != 167
    - inventory_hostname in groups['ceph_' + ceph_cluster_name + '_mon']
  ansible.builtin.shell: |
    systemctl start ceph-mon.target
    systemctl start ceph-mgr.target
    sleep 10
  changed_when: true

- name: Make sure mds is started  # noqa: command-instead-of-module
  when:
    - ceph_user_info.uid != 167
    - inventory_hostname in groups['ceph_' + ceph_cluster_name + '_mds']
  ansible.builtin.shell: |
    systemctl start ceph-mds.target
    sleep 10
  changed_when: true

- name: Make sure osds are started  # noqa: command-instead-of-module
  when:
    - ceph_user_info.uid != 167
    - inventory_hostname in groups['ceph_' + ceph_cluster_name + '_osd']
  ansible.builtin.shell: |
    systemctl start ceph-osd.target
  changed_when: true

- name: Wait for all OSDs on this node to be up after UID renumber
  ansible.builtin.command: ceph osd stat --format json
  register: _osd_post_renumber
  until: >-
    (_osd_post_renumber.stdout | from_json).num_up_osds ==
    (_osd_post_renumber.stdout | from_json).num_osds
  retries: 60
  delay: 5
  changed_when: false
  delegate_to: "{{ ceph_bootstrap_node }}"
  when:
    - ceph_user_info.uid != 167
    - inventory_hostname in groups['ceph_' + ceph_cluster_name + '_osd']

- name: Make sure radosgw is started  # noqa: command-instead-of-module
  when:
    - ceph_user_info.uid != 167
    - inventory_hostname in groups['ceph_' + ceph_cluster_name + '_rgw']
  ansible.builtin.shell: |
    systemctl start ceph-radosgw.target
    sleep 10
  changed_when: true

# -----------------------------------------------------------------------
# Adopt bootstrap MON + MGR
# -----------------------------------------------------------------------

- name: "Migration: adopt bootstrap MON daemon"
  ansible.builtin.command: >
    cephadm adopt --style legacy --name mon.{{ ceph_bootstrap_node | split('.') | first }} --skip-pull
  when:
    - inventory_hostname == ceph_bootstrap_node
    - _needs_mon_adopt | default(false)
  changed_when: true

- name: "Migration: adopt bootstrap MGR daemon"
  ansible.builtin.command: >
    cephadm adopt --style legacy --name mgr.{{ ceph_bootstrap_node | split('.') | first }} --skip-pull
  when:
    - inventory_hostname == ceph_bootstrap_node
    - _needs_mon_adopt | default(false)
  changed_when: true

- name: "Migration: wait for all mons to be online after bootstrap MON adoption"
  ansible.builtin.command: ceph quorum_status --format json
  register: _bootstrap_quorum
  until: >-
    (_bootstrap_quorum.stdout | from_json).quorum | length >=
    (groups['ceph_' + ceph_cluster_name + '_mon'] | length // 2 + 1)
  retries: 30
  delay: 10
  changed_when: false
  when:
    - inventory_hostname == ceph_bootstrap_node
    - _needs_mon_adopt | default(false)

- name: "Force our mgr to be primary by forcibly failing all others"
  # Run the fail-loop twice with a brief pause: a standby can be promoted
  # back to active before our adopted mgr wins the election, so a single
  # round occasionally leaves a legacy mgr in charge.
  ansible.builtin.shell: |
    sleep 5
    {% for node in groups['ceph_' + ceph_cluster_name + '_mon'] %}
    {%   if node != inventory_hostname %}
    ceph mgr fail {{ node | split('.') | first }}
    {%   endif %}
    {% endfor %}
    {% for node in groups['ceph_' + ceph_cluster_name + '_mon'] %}
    {%   if node != inventory_hostname %}
    ceph mgr fail {{ node | split('.') | first }}
    {%   endif %}
    {% endfor %}
  changed_when: true
  when:
    - inventory_hostname == ceph_bootstrap_node
    - _needs_mon_adopt | default(false)

- name: "Wait for our mgr to become active"
  ansible.builtin.command: ceph mgr stat --format json
  register: _mgr_active
  until: >-
    (_mgr_active.stdout | from_json).active_name ==
    (inventory_hostname | split('.') | first)
  retries: 30
  delay: 2
  changed_when: false
  when:
    - inventory_hostname == ceph_bootstrap_node
    - _needs_mon_adopt | default(false)

# -----------------------------------------------------------------------
# Enable cephadm orchestrator (idempotent)
# -----------------------------------------------------------------------

- name: "Migration: check if cephadm orchestrator already active"
  ansible.builtin.command: ceph orch status --format json
  register: _orch_status
  changed_when: false
  run_once: true
  delegate_to: "{{ ceph_bootstrap_node }}"
  failed_when: false

- name: "Migration: enable cephadm mgr module"
  ansible.builtin.command: ceph mgr module enable cephadm --force
  run_once: true
  delegate_to: "{{ ceph_bootstrap_node }}"
  when: >-
    (_orch_status.stdout | trim | default('{}') | from_yaml).backend | default('') != 'cephadm'
  changed_when: true

- name: "Migration: set orchestrator backend to cephadm"
  ansible.builtin.command: ceph orch set backend cephadm
  run_once: true
  delegate_to: "{{ ceph_bootstrap_node }}"
  when: >-
    (_orch_status.stdout | trim | default('{}') | from_yaml).backend | default('') != 'cephadm'
  changed_when: true

- name: "Migration: configure cephadm SSH user"
  ansible.builtin.command: >
    ceph cephadm set-user {{ ceph_cephadm_user }}
  run_once: true
  delegate_to: "{{ ceph_bootstrap_node }}"
  changed_when: false

- name: "Migration: configure cephadm SSH private key"
  ansible.builtin.command: ceph cephadm set-priv-key -i {{ ceph_cephadm_home }}/.ssh/id_ed25519
  run_once: true
  delegate_to: "{{ ceph_bootstrap_node }}"
  changed_when: false

- name: "Migration: configure cephadm SSH public key"
  ansible.builtin.command: ceph cephadm set-pub-key -i {{ ceph_cephadm_home }}/.ssh/id_ed25519.pub
  run_once: true
  delegate_to: "{{ ceph_bootstrap_node }}"
  changed_when: false

# -----------------------------------------------------------------------
# Register host with orchestrator
# -----------------------------------------------------------------------

- name: "Migration: get registered hosts"
  ansible.builtin.command: ceph orch host ls --format json
  register: _migrate_orch_hosts
  changed_when: false
  run_once: true
  delegate_to: "{{ ceph_bootstrap_node }}"

- name: "Migration: add host to orchestrator"
  ansible.builtin.command: >
    ceph orch host add {{ inventory_hostname }} {{ ceph_mon_ip }}
  when: >-
    inventory_hostname not in
    (_migrate_orch_hosts.stdout | from_json | map(attribute='hostname') | list)
  delegate_to: "{{ ceph_bootstrap_node }}"
  changed_when: true

# -----------------------------------------------------------------------
# Adopt non-bootstrap MON + MGR node
# -----------------------------------------------------------------------

- name: "Migration: adopt remaining MON nodes one at a time"
  throttle: 1
  when:
    - inventory_hostname != ceph_bootstrap_node
    - _needs_mon_adopt | default(false)
  block:
    - name: "Migration: per-MON adoption step"
      ansible.builtin.include_tasks: cephadm-migrate-mon-step.yml

# -----------------------------------------------------------------------
# Adopt OSD daemons (per node, parallel across nodes)
# -----------------------------------------------------------------------

- name: "Migration: get legacy OSD list on this node"
  ansible.builtin.command: ceph-volume lvm list --format json
  register: _node_osd_list
  changed_when: false
  failed_when: false
  when:
    - _needs_osd_adopt | default(false)

- name: "Migration: adopt each legacy OSD on this node"
  ansible.builtin.command: >
    cephadm adopt --style legacy --name osd.{{ item }} --skip-pull
  loop: >-
    {{ (_node_osd_list.stdout | default('{}') | from_json).keys() | list }}
  when:
    - _needs_osd_adopt | default(false)
    - _node_osd_list is not skipped
  changed_when: true

- name: "Migration: verify OSD count unchanged after adoption"
  ansible.builtin.command: ceph osd stat --format json
  register: _post_osd_stat
  changed_when: false
  run_once: true
  delegate_to: "{{ ceph_bootstrap_node }}"
  when: _needs_osd_adopt | default(false)

- name: "Migration: assert OSD count matches pre-migration count"
  ansible.builtin.assert:
    that: >-
      (_post_osd_stat.stdout | from_json).num_osds ==
      (_osd_stat.stdout | from_json).num_osds
    fail_msg: >-
      OSD count changed during migration!
      Before: {{ (_osd_stat.stdout | from_json).num_osds }}
      After:  {{ (_post_osd_stat.stdout | from_json).num_osds }}
  run_once: true
  delegate_to: "{{ ceph_bootstrap_node }}"
  when: _needs_osd_adopt | default(false)

# -----------------------------------------------------------------------
# Adopt MDS daemon
# -----------------------------------------------------------------------

- name: "Migration: adopt MDS daemon on this node"
  ansible.builtin.command: >
    cephadm adopt --style legacy --name mds.{{ inventory_hostname | split('.') | first }} --skip-pull
  when:
    - _needs_mds_adopt | default(false)
  changed_when: true

# -----------------------------------------------------------------------
# RGW: Spin up new RGW node and disable old RGW node
# -----------------------------------------------------------------------

- name: "Migrate RGW"
  throttle: 1
  when: _needs_rgw_adopt | default(false)
  block:
    - name: Stop current RGW daemon
      ansible.builtin.systemd_service:
        name: ceph-radosgw.target
        state: stopped
    - name: Apply label to current host
      ansible.builtin.command: >
        ceph orch host label add {{ inventory_hostname | split('.') | first }} rgw
      changed_when: true
    # I think its ok to run apply for each node, think it might cause it to re-spawn based on the label
    - name: Deploy new ceph_rgw node
      ansible.builtin.command: >
        ceph orch apply rgw {{ ceph_rgw["realm"] }}
          --realm={{ ceph_rgw["realm"] }}
          --zonegroup={{ ceph_rgw["zonegroup"] }}
          --zone={{ ceph_rgw["zone"] }}
          --port={{ ceph_rgw["port"] | default(7480) }}
          --placement "label:rgw"
      changed_when: true
    - name: Delete old directory
      ansible.builtin.file:
        path: "/var/lib/ceph/radosgw/ceph-rgw.{{ inventory_hostname | split('.') | first }}"
        state: absent


# -------------------------------------------------------
# Remove legacy Ceph packages (after all daemons adopted)
# -------------------------------------------------------

- name: "Migration: remove legacy ceph and radosgw packages"
  ansible.builtin.apt:
    name:
      - ceph
      - radosgw
    state: absent
    purge: true
    autoremove: true
