---
- name: "List active ceph daemon units on this node"  # noqa: command-instead-of-module
  ansible.builtin.shell: >
    systemctl list-units --no-legend --no-pager --plain
    'ceph-{{ ceph_uuid }}@*.service' 2>/dev/null || true
  register: _ceph_units
  changed_when: false
  args:
    executable: /bin/bash

- name: "Parse daemon types and build unit list"
  ansible.builtin.set_fact:
    _ceph_daemon_units: >-
      {%- set ns = namespace(units=[]) -%}
      {%- for line in _ceph_units.stdout_lines -%}
        {%- set parts = line.split() -%}
        {%- if parts | length > 0 -%}
          {%- set unit = parts[0] -%}
          {%- if '@' in unit -%}
            {%- set daemon_part = unit.split('@')[1] | regex_replace('\\.service$', '') -%}
            {%- set daemon_type = daemon_part.split('.')[0] -%}
            {%- set nice = -5 if daemon_type == 'rgw' else -10 -%}
            {%- set ns.units = ns.units + [{'unit': unit, 'type': daemon_type, 'nice': nice}] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.units }}

- name: "Create systemd override directory for each daemon"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.unit }}.d"
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop: "{{ _ceph_daemon_units }}"

- name: "Write Nice= systemd override for each daemon"
  ansible.builtin.template:
    src: nice-override.conf.j2
    dest: "/etc/systemd/system/{{ item.unit }}.d/nice.conf"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ _ceph_daemon_units }}"
  vars:
    nice_value: "{{ item.nice }}"
  register: _nice_overrides

- name: "Reload systemd and restart daemons whose Nice level changed"  # noqa: no-handler
  ansible.builtin.systemd:
    name: "{{ item.item.unit }}"
    daemon_reload: true
    state: restarted
  loop: "{{ _nice_overrides.results }}"
  when: item.changed
