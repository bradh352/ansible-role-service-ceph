---
# Settings here mirror the legacy templates/nfs.conf.j2 from the pre-cephadm
# era so behavior is preserved across migration: NFSv4-only over TCP, RW,
# no_root_squash, FSAL_CEPH against the named filesystem.

- name: "Apply NFS export for cluster {{ _nfs_fs.name }}"
  ansible.builtin.command:
    cmd: "ceph nfs export apply {{ _nfs_fs.name }} -i -"
    stdin: "{{ _nfs_export_spec | to_nice_json }}"
  vars:
    _nfs_pseudo: "{{ _nfs_fs.nfs_export | default('/' + _nfs_fs.name) }}"
    _nfs_path: "{{ _nfs_fs.nfs_root | default('/') }}"
    _nfs_export_spec:
      cluster_id: "{{ _nfs_fs.name }}"
      pseudo: "{{ _nfs_pseudo }}"
      path: "{{ _nfs_path }}"
      access_type: "RW"
      squash: "no_root_squash"
      protocols: [4]
      transports: ["TCP"]
      fsal:
        name: "CEPH"
        fs_name: "{{ _nfs_fs.name }}"
  changed_when: true
