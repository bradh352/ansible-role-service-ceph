---
- name: "Check required variables"
  ansible.builtin.fail:
    msg: "Must specify ceph_cluster_name, ceph_public_network, ceph_cluster_network, and ceph_uuid"
  when: >-
    ceph_cluster_name is not defined or
    ceph_public_network is not defined or
    ceph_cluster_network is not defined or
    ceph_uuid is not defined

- name: "Gather ceph hosts"
  ansible.builtin.set_fact:
    ceph_hosts_json: "{{ lookup('template', 'ceph_hosts.j2') }}"

- name: "Parse ceph hosts"
  ansible.builtin.set_fact:
    ceph_hosts: "{{ ceph_hosts_json | from_yaml }}"

- name: "Build full list of all cluster nodes"
  ansible.builtin.set_fact:
    _ceph_all_nodes: >-
      {{ (groups['ceph_' + ceph_cluster_name + '_mon'] | default([]) +
          groups['ceph_' + ceph_cluster_name + '_osd'] | default([]) +
          groups['ceph_' + ceph_cluster_name + '_mds'] | default([]) +
          groups['ceph_' + ceph_cluster_name + '_rgw'] | default([]))
         | unique | sort }}

- name: "Add known ceph nodes to /etc/hosts"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: >-
      {{ hostvars[item]['ceph_mon_ip'] }} {{ item | split('.') | first }} {{ item }}
  loop: >-
    {{ ceph_hosts | reject('search', inventory_hostname | split('.') | first) }}
  when: hostvars[item]['ceph_mon_ip'] is defined

- name: "Fixup ansible password for this playbook if it was changed in the base role"
  ansible.builtin.set_fact:
    ansible_password: "{{ superuser_password }}"
    ansible_become_pass: "{{ superuser_password }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  no_log: true
  when: >-
    ansible_user == superuser and
    ((superuser_created is defined and superuser_created.changed) or
     (superuser_pwchanged is defined and superuser_pwchanged.changed))
  loop: "{{ groups['ceph_' + ceph_cluster_name + '_mon'] | unique | sort }}"

# -----------------------------------------------------------------------
# NFS exports fact (used throughout)
# -----------------------------------------------------------------------

- name: "Determine which filesystems have NFS exports"
  ansible.builtin.set_fact:
    ceph_nfs_exports: >-
      {{ ceph_fs | default([])
         | selectattr('nfs', 'defined')
         | selectattr('nfs', 'equalto', true)
         | map(attribute='name') | list }}

# -----------------------------------------------------------------------
# Deployment mode detection (Step 6)
# -----------------------------------------------------------------------

- name: "List active ceph daemon units on this node"  # noqa: command-instead-of-module
  ansible.builtin.shell: >
    set -o pipefail;
    systemctl list-units --no-legend --no-pager --plain
    'ceph-{{ ceph_uuid | lower }}@*.service' | awk '{ print $1 };'
  register: _cephadm_units
  changed_when: false
  args:
    executable: /bin/bash

- name: "Detect legacy MON data directory"
  ansible.builtin.stat:
    path: "/var/lib/ceph/mon/ceph-{{ inventory_hostname | split('.') | first }}"
  register: _legacy_mon_dir
  when: inventory_hostname in groups['ceph_' + ceph_cluster_name + '_mon']

- name: "Detect legacy OSD (ceph-volume LVM)"
  ansible.builtin.command: ceph-volume lvm list --format json
  register: _legacy_osd_list
  failed_when: false
  changed_when: false
  when: inventory_hostname in groups['ceph_' + ceph_cluster_name + '_osd']

- name: "Detect legacy MDS data directory"
  ansible.builtin.stat:
    path: "/var/lib/ceph/mds/ceph-{{ inventory_hostname | split('.') | first }}"
  register: _legacy_mds_dir
  when: inventory_hostname in groups['ceph_' + ceph_cluster_name + '_mds']

- name: "Detect legacy RGW data directory"
  ansible.builtin.stat:
    path: "/var/lib/ceph/radosgw/ceph-rgw.{{ inventory_hostname | split('.') | first }}"
  register: _legacy_rgw_dir
  when: >-
    groups['ceph_' + ceph_cluster_name + '_rgw'] is defined and
    inventory_hostname in groups['ceph_' + ceph_cluster_name + '_rgw']

- name: "Set per-daemon migration flags"
  ansible.builtin.set_fact:
    _cephadm_units_present: "{{ _cephadm_units.stdout_lines | length > 0 }}"
    # Backslashes in the regex must be single (`\.`) not double (`\\.`):
    # YAML `>-` folded scalars pass backslashes through verbatim, so Jinja
    # sees a literal double-backslash and produces a regex that won't
    # match `ceph-<uuid>@<type>.<n>.service` unit names.
    _needs_mon_adopt: >-
      {{ inventory_hostname in groups['ceph_' + ceph_cluster_name + '_mon'] and
         (_legacy_mon_dir.stat.exists | default(false)) and
         not (_cephadm_units.stdout_lines
              | select('match', 'ceph-' + (ceph_uuid | lower) + '@mon\..*\.service')
              | list | length > 0) }}
    _needs_osd_adopt: >-
      {{ inventory_hostname in groups['ceph_' + ceph_cluster_name + '_osd'] and
         ((_legacy_osd_list.stdout | default('{}', true)) | from_json | length > 0) and
         not (_cephadm_units.stdout_lines
              | select('match', 'ceph-' + (ceph_uuid | lower) + '@osd\..*\.service')
              | list | length > 0) }}
    _needs_mds_adopt: >-
      {{ inventory_hostname in groups['ceph_' + ceph_cluster_name + '_mds'] and
         (_legacy_mds_dir.stat.exists | default(false)) and
         not (_cephadm_units.stdout_lines
              | select('match', 'ceph-' + (ceph_uuid | lower) + '@mds\..*\.service')
              | list | length > 0) }}
    _needs_rgw_adopt: >-
      {{ groups['ceph_' + ceph_cluster_name + '_rgw'] is defined and
         inventory_hostname in groups['ceph_' + ceph_cluster_name + '_rgw'] and
         (_legacy_rgw_dir.stat.exists | default(false)) and
         not (_cephadm_units.stdout_lines
              | select('match', 'ceph-' + (ceph_uuid | lower) + '@rgw\..*\.service')
              | list | length > 0) }}
    _needs_nfs_adopt: >-
      {{ groups['ceph_' + ceph_cluster_name + '_mds'] is defined and
         inventory_hostname in groups['ceph_' + ceph_cluster_name + '_mds'] and
         ceph_nfs_exports | length > 0 and
         not (_cephadm_units.stdout_lines
              | select('match', 'ceph-' + (ceph_uuid | lower) + '@nfs')
              | list | length > 0) }}

# Compute the deployment mode on every host rather than once-and-broadcast:
# the prior `run_once: true` set the fact only on the first host *in the play*,
# but the broadcast then read it from `hostvars[<first MON in the inventory
# group>]` -- which fails when the play targets a subset of MONs (e.g. a single
# host being migrated). The expression is a pure function of `groups` and
# `hostvars` with `default=false` on missing flags, so each host computes the
# same value on its own.
- name: "Compute cluster-wide deployment mode"
  ansible.builtin.set_fact:
    ceph_deployment_mode: >-
      {%- set mon_legacy = groups['ceph_' + ceph_cluster_name + '_mon']
            | map('extract', hostvars)
            | map(attribute='_needs_mon_adopt', default=false)
            | select | list | length > 0 -%}
      {%- set osd_legacy = groups['ceph_' + ceph_cluster_name + '_osd']
            | map('extract', hostvars)
            | map(attribute='_needs_osd_adopt', default=false)
            | select | list | length > 0 -%}
      {%- set mds_legacy = groups['ceph_' + ceph_cluster_name + '_mds']
            | map('extract', hostvars)
            | map(attribute='_needs_mds_adopt', default=false)
            | select | list | length > 0 -%}
      {%- set rgw_legacy = (groups['ceph_' + ceph_cluster_name + '_rgw'] | default([]))
            | map('extract', hostvars)
            | map(attribute='_needs_rgw_adopt', default=false)
            | select | list | length > 0 -%}
      {%- set any_cephadm = _ceph_all_nodes
            | map('extract', hostvars)
            | map(attribute='_cephadm_units_present', default=false)
            | select | list | length > 0 -%}
      {%- if mon_legacy or osd_legacy or mds_legacy or rgw_legacy -%}legacy
      {%- elif any_cephadm -%}cephadm
      {%- else -%}fresh{%- endif -%}

# -----------------------------------------------------------------------
# Bootstrap node election
# For cephadm/fresh: first sorted MON (admin keyring may not exist yet)
# For legacy: existing keyring-based election (preserved from original)
# -----------------------------------------------------------------------

- name: "Determine nodes which are initialized with Admin keyring"
  ansible.builtin.stat:
    path: /etc/ceph/ceph.client.admin.keyring
  delegate_to: "{{ item }}"
  ignore_unreachable: true
  ignore_errors: true
  failed_when: false
  changed_when: false
  register: ceph_nodes_adminkeyring
  loop: "{{ groups['ceph_' + ceph_cluster_name + '_mon'] | unique | sort }}"

- name: "Determine nodes which are initialized with OSD keyring"
  ansible.builtin.stat:
    path: /var/lib/ceph/bootstrap-osd/ceph.keyring
  delegate_to: "{{ item }}"
  ignore_unreachable: true
  ignore_errors: true
  failed_when: false
  changed_when: false
  register: ceph_nodes_osdkeyring
  loop: "{{ groups['ceph_' + ceph_cluster_name + '_mon'] | unique | sort }}"

- name: "Determine which node to use for bootstrapping"
  ansible.builtin.set_fact:
    ceph_bootstrap_node: >-
      {%- if ceph_deployment_mode in ['cephadm', 'fresh'] -%}
        {{ groups['ceph_' + ceph_cluster_name + '_mon'] | unique | sort | first }}
      {%- else -%}
        {%- set ns = namespace(eligible_admin=[], eligible_osd=[]) -%}
        {%- for node in ceph_nodes_adminkeyring.results -%}
          {%- if node.stat.exists | default(false) -%}
            {%- set ns.eligible_admin = ns.eligible_admin + [node.item] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- for node in ceph_nodes_osdkeyring.results -%}
          {%- if node.stat.exists | default(false) -%}
            {%- set ns.eligible_osd = ns.eligible_osd + [node.item] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set eligible = ns.eligible_admin | intersect(ns.eligible_osd) | unique | sort -%}
        {%- if eligible | length == 0 -%}
          {%- set eligible = [groups['ceph_' + ceph_cluster_name + '_mon'] | unique | sort | first] -%}
        {%- endif -%}
        {{ eligible[0] }}
      {%- endif -%}

- name: "See if we have the client admin keyring installed"
  ansible.builtin.stat:
    path: /etc/ceph/ceph.client.admin.keyring
  register: admin_keyring

- name: "See if we have the osd keyring installed"
  ansible.builtin.stat:
    path: /var/lib/ceph/bootstrap-osd/ceph.keyring
  register: osd_keyring

- name: "Check to see if we need to bootstrap (fresh path only)"
  ansible.builtin.set_fact:
    ceph_bootstrap: >-
      {{ ceph_deployment_mode == 'fresh' and
         (not admin_keyring.stat.exists or not osd_keyring.stat.exists) and
         inventory_hostname == ceph_bootstrap_node }}

# -----------------------------------------------------------------------
# Phase 1: Prerequisites (all nodes)
# -----------------------------------------------------------------------

- name: "Cephadm prerequisites: user, SSH, sudo, podman, binary, image pull"
  ansible.builtin.import_tasks: cephadm-prereqs.yml

# -----------------------------------------------------------------------
# Phase 2: Version check / upgrade (bootstrap node)
# -----------------------------------------------------------------------

- name: "Version check and upgrade orchestration"
  ansible.builtin.import_tasks: cephadm-version.yml
  when: inventory_hostname == ceph_bootstrap_node

# -----------------------------------------------------------------------
# Phase 3a: Legacy migration path
# -----------------------------------------------------------------------

- name: "Migrate legacy cluster to cephadm"
  ansible.builtin.include_tasks: cephadm-migrate.yml
  when: ceph_deployment_mode == 'legacy'

- name: "Migrate legacy nfs cephadm"
  ansible.builtin.include_tasks: cephadm-migrate-nfs.yml
  when: _needs_nfs_adopt

# -----------------------------------------------------------------------
# Phase 3b: Fresh install bootstrap
# -----------------------------------------------------------------------

- name: "Bootstrap new cluster"
  ansible.builtin.include_tasks: cephadm-bootstrap.yml
  when:
    - ceph_deployment_mode == 'fresh'
    - inventory_hostname == ceph_bootstrap_node

# -----------------------------------------------------------------------
# Admin keyring distribution (fresh path: after bootstrap)
# -----------------------------------------------------------------------

- name: "Fetch the client admin keyring from bootstrap node"
  ansible.builtin.command: base64 /etc/ceph/ceph.client.admin.keyring
  register: admin_keyring_data
  changed_when: false
  when:
    - ceph_deployment_mode == 'fresh'
    - not ceph_bootstrap
    - not admin_keyring.stat.exists
  delegate_to: "{{ ceph_bootstrap_node }}"

- name: "Install the client admin keyring on other MON nodes"
  ansible.builtin.copy:
    dest: /etc/ceph/ceph.client.admin.keyring
    content: "{{ admin_keyring_data.stdout | b64decode }}"
    mode: "0640"
    owner: root
    group: root
  when:
    - ceph_deployment_mode == 'fresh'
    - not ceph_bootstrap
    - not admin_keyring.stat.exists
    - inventory_hostname in groups['ceph_' + ceph_cluster_name + '_mon']

# -----------------------------------------------------------------------
# Global cluster config (bootstrap node, all paths)
# -----------------------------------------------------------------------

- name: "Apply global ceph config"
  ansible.builtin.include_tasks: cephadm-config.yml
  when: inventory_hostname == ceph_bootstrap_node

# -----------------------------------------------------------------------
# Host registration + service specs
#
# cephadm-hosts.yml runs unconditionally per-host: it is idempotent
# (host-add is gated on the orchestrator's registered list, label-add
# is server-side idempotent). Running it during a partial migration
# is safe because main.yml runs cephadm-migrate.yml first, so any
# host this loop touches has already had its daemons adopted.
# All orch commands inside delegate to the bootstrap node so hosts
# without an admin keyring (OSD/MDS-only nodes during legacy
# migration) can still register/label themselves.
# -----------------------------------------------------------------------

- name: "Register hosts and labels with orchestrator"
  ansible.builtin.include_tasks: cephadm-hosts.yml

# Apply specs even during legacy migration. By the time main.yml reaches
# this point, cephadm-migrate.yml has adopted the bootstrap MON+MGR and
# enabled the orchestrator. Running the spec apply here lets cephadm
# reconcile against already-adopted daemons and keeps the role's end
# state identical between a one-shot migration run and a post-migration
# re-run.
- name: "Apply service specs"
  ansible.builtin.include_tasks: cephadm-services.yml
  when: inventory_hostname == ceph_bootstrap_node

# -----------------------------------------------------------------------
# Pools, CephFS (bootstrap node)
# -----------------------------------------------------------------------

- name: "Configure pools"
  ansible.builtin.include_tasks: ceph-pools.yml
  when:
    - ceph_pools is defined
    - ceph_pools | length > 0
    - inventory_hostname == ceph_bootstrap_node

- name: "Configure filesystems"
  ansible.builtin.include_tasks: ceph-fs.yml
  when:
    - ceph_fs is defined
    - ceph_fs | length > 0
    - inventory_hostname == ceph_bootstrap_node

# -----------------------------------------------------------------------
# NFS (bootstrap node)
# -----------------------------------------------------------------------

- name: "Configure NFS exports"
  ansible.builtin.include_tasks: cephadm-nfs.yml
  when:
    - ceph_nfs_exports | length > 0
    - inventory_hostname == ceph_bootstrap_node

# -----------------------------------------------------------------------
# RGW (bootstrap node)
# -----------------------------------------------------------------------

- name: "Configure RGW zone"
  ansible.builtin.include_tasks: cephadm-rgw.yml
  when:
    - groups['ceph_' + ceph_cluster_name + '_rgw'] is defined
    - groups['ceph_' + ceph_cluster_name + '_rgw'] | length > 0
    - ceph_rgw is defined
    - inventory_hostname == ceph_bootstrap_node

# -----------------------------------------------------------------------
# CRUSH topology (bootstrap node)
# -----------------------------------------------------------------------

- name: "Validate and apply CRUSH topology"
  ansible.builtin.include_tasks: cephadm-crush.yml
  when: inventory_hostname == ceph_bootstrap_node

# -----------------------------------------------------------------------
# Image normalization (bootstrap node)
#
# Re-deploy any daemon whose container image drifted from
# `ceph_container_image` (e.g. mds/rgw/nfs daemons that inherited a
# `docker.io/ceph/daemon-base:latest-master-devel` per-daemon image
# override at adoption time and that `ceph orch upgrade` then refused
# to touch).
# -----------------------------------------------------------------------

- name: "Normalize daemon container images"
  ansible.builtin.include_tasks: cephadm-normalize-images.yml
  when: inventory_hostname == ceph_bootstrap_node

# -----------------------------------------------------------------------
# Nice levels (all nodes)
# -----------------------------------------------------------------------

- name: "Apply systemd Nice= overrides to containerized daemons"
  ansible.builtin.import_tasks: cephadm-nice.yml

# -----------------------------------------------------------------------
# Prometheus (bootstrap node, optional)
# -----------------------------------------------------------------------

- name: "Configure Prometheus metrics"
  ansible.builtin.include_tasks: cephadm-prometheus.yml
  when:
    - ceph_prometheus
    - inventory_hostname == ceph_bootstrap_node
