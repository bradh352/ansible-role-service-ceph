---
# Pin the cluster-wide image cephadm uses for newly-created daemons.
# Without this, cephadm falls back to the DEFAULT_IMAGE compiled into the
# installed `cephadm` binary (often a much older release than ceph_version),
# so a new host whose OSDs get scheduled by the label-based osd spec ends
# up running the wrong major version until cephadm-normalize-images
# eventually heals it. Setting the full `:vX.Y.Z` tag here, on every
# play, makes the initial deploy land on the right image. The
# normalize-images pass later in main.yml is still the safety net.
- name: "Pin cluster container image (including version tag)"
  ansible.builtin.command: >
    ceph config set mgr mgr/cephadm/container_image_base
    {{ ceph_container_image }}:v{{ ceph_version }}
  changed_when: false

- name: "Apply global ceph cluster config"
  ansible.builtin.command: >
    ceph config set {{ item.who }} {{ item.key }} {{ item.value }}
  loop:
    - {who: global, key: osd_pool_default_size, value: "{{ ceph_default_pool_size }}"}
    - {who: global, key: osd_pool_default_min_size, value: "{{ ceph_default_min_pool_size }}"}
    - {who: global, key: osd_pool_default_pg_autoscale_mode, value: "on"}
    - {who: global, key: bdev_enable_discard, value: "true"}
    - {who: global, key: bdev_async_discard_threads, value: "1"}
    - {who: global, key: rbd_read_from_replica_policy, value: "balance"}
    - {who: global, key: auth_allow_insecure_global_id_reclaim, value: "false"}
    - {who: global, key: mon_cluster_log_to_syslog, value: "true"}
    - {who: global, key: mon_allow_pool_delete, value: "true"}
    - {who: osd, key: osd_memory_target_autotune, value: "{{ ceph_osd_memory_target_autotune | string | lower }}"}
    - {who: osd, key: osd_memory_target, value: "{{ ceph_osd_memory_target }}"}
  changed_when: false
