---
- name: "Get currently registered hosts from orchestrator"
  ansible.builtin.command: ceph orch host ls --format json
  register: _orch_hosts
  changed_when: false

- name: "Build set of already-registered hostnames"
  ansible.builtin.set_fact:
    _registered_hosts: >-
      {{ _orch_hosts.stdout | from_json | map(attribute='hostname') | list }}

- name: "Add current host to cephadm orchestrator"
  ansible.builtin.command: >
    ceph orch host add {{ inventory_hostname }} {{ ceph_mon_ip | default(ansible_host) }}
  when: inventory_hostname not in _registered_hosts
  changed_when: true

- name: "Apply host labels based on group membership"
  ansible.builtin.command: >
    ceph orch host label add {{ inventory_hostname | split('.') | first }} {{ item }}
  loop: "{{ _host_labels }}"
  vars:
    _is_mon: "{{ inventory_hostname in groups['ceph_' + ceph_cluster_name + '_mon'] }}"
    _is_osd: "{{ inventory_hostname in groups['ceph_' + ceph_cluster_name + '_osd'] }}"
    _is_mds: "{{ inventory_hostname in groups['ceph_' + ceph_cluster_name + '_mds'] }}"
    _is_nfs: "{{ _is_mds and ceph_nfs_exports | length > 0 }}"
    _host_labels: >-
      {%- set ns = namespace(labels=[]) -%}
      {%- if _is_mon %}{% set ns.labels = ns.labels + ['mon', 'mgr'] %}{% endif -%}
      {%- if _is_osd %}{% set ns.labels = ns.labels + ['osd'] %}{% endif -%}
      {%- if _is_mds %}{% set ns.labels = ns.labels + ['mds'] %}{% endif -%}
      {%- if _is_nfs %}{% set ns.labels = ns.labels + ['nfs'] %}{% endif -%}
      {{ ns.labels }}
  changed_when: false
