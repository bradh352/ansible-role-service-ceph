---
# Detect daemons running a container image outside of `ceph_container_image`
# and force a redeploy with the configured image. This is the self-healing
# step for clusters where adoption inherited a legacy containerized image
# (e.g. docker.io/ceph/daemon-base:latest-master-devel from the older
# ceph-ansible containerized model) as a per-daemon override that
# `ceph orch upgrade` then refused to touch.
#
# `ceph orch redeploy <service>` does not accept --image; only the
# daemon-level `ceph orch daemon redeploy <daemon_name> [<image>]`
# form does. Operate per-daemon so we can pin the image explicitly.

- name: "Get current daemon image inventory"
  ansible.builtin.command: ceph orch ps --format json
  register: _orch_ps_normalize
  changed_when: false
  delegate_to: "{{ ceph_bootstrap_node }}"

- name: "Find daemons not on the configured ceph image"
  ansible.builtin.set_fact:
    _daemons_needing_redeploy: >-
      {{ (_orch_ps_normalize.stdout | from_json)
         | rejectattr('container_image_name', 'match', '^' + (ceph_container_image | regex_escape) + ':')
         | map(attribute='daemon_name') | list }}

- name: "Redeploy mismatched daemons with correct image"
  ansible.builtin.command: >
    ceph orch daemon redeploy {{ item }} {{ ceph_container_image }}:v{{ ceph_version }}
  loop: "{{ _daemons_needing_redeploy }}"
  when: _daemons_needing_redeploy | length > 0
  delegate_to: "{{ ceph_bootstrap_node }}"
  changed_when: true

# Daemons mid-redeploy may have missing keys (no container_image_name,
# no status_desc), so coerce to empty/non-running before comparing.
- name: "Wait for redeployed daemons to settle on the configured image"
  ansible.builtin.command: ceph orch ps --format json
  register: _orch_ps_post_redeploy
  vars:
    _post_daemons: "{{ _orch_ps_post_redeploy.stdout | default('[]') | from_json }}"
    _expected_image_re: "^{{ ceph_container_image | regex_escape }}:"
  until: >-
    (_post_daemons | rejectattr('container_image_name', 'defined') | list | length == 0)
    and
    (_post_daemons
     | selectattr('container_image_name', 'defined')
     | rejectattr('container_image_name', 'match', _expected_image_re)
     | list | length == 0)
    and
    (_post_daemons
     | selectattr('status_desc', 'defined')
     | selectattr('status_desc', 'equalto', 'running')
     | list | length == _post_daemons | length)
  retries: 60
  delay: 15
  changed_when: false
  delegate_to: "{{ ceph_bootstrap_node }}"
  when: _daemons_needing_redeploy | length > 0
