---
ceph_default_pool_size: 3
ceph_default_min_pool_size: 2
ceph_prometheus: false

ceph_version: "19.2.3"
ceph_container_image: "quay.io/ceph/ceph"
ceph_cephadm_user: "cephadm"

# --- Upgrade orchestration (see cephadm-version.yml and UPGRADING.md) ---
#
# Bumping `ceph_version` on an existing cephadm cluster triggers
# `ceph orch upgrade start`. The orchestrator does the rolling restart;
# these knobs control how the role gates and waits on it.

# Poll interval and overall ceiling for the upgrade wait. A major-version
# upgrade restarts every daemon in the cluster one at a time, gated on
# `ok-to-stop`, so wall-clock time scales with OSD count. The former
# 60-minute ceiling was only ever enough for a lab. 6h / 30s = 720 polls.
ceph_upgrade_timeout_minutes: 360
ceph_upgrade_poll_delay: 30

# Cluster health states under which the role will *start* an upgrade.
# HEALTH_WARN is permitted by default because real clusters idle there for
# benign reasons; the OSD and PG assertions are the substantive gate.
ceph_upgrade_allowed_health: ["HEALTH_OK", "HEALTH_WARN"]

# PG states that must be absent before an upgrade starts. Upstream: begin
# only with "no down, recovering, incomplete, undersized or backfilling
# PGs". Matched as substrings against each `pgmap.pgs_by_state` entry.
ceph_upgrade_blocking_pg_states:
  - down
  - recovering
  - incomplete
  - undersized
  - backfilling

# Run `ceph orch upgrade check --image ...` first. Catches a mistyped tag
# or an unreachable registry while it is still free to fix, instead of at
# UPGRADE_FAILED_PULL with daemons already restarting.
ceph_upgrade_precheck: true

# Hold the global `noautoscale` flag for the duration of the upgrade so PG
# splits/merges cannot stall daemon restarts, then clear it. The role
# enables the autoscaler on every pool it creates, so this applies.
ceph_upgrade_pause_autoscale: true
ceph_osd_min_size: 1099511627776
ceph_osd_rotational: ~

# OSD memory limits. Pinned explicitly because cephadm's autotune
# default is unreliable across releases/installers, and on a
# hyperconverged host the autotuned value (~0.7 * host_RAM / num_osds)
# can crowd out the colocated workloads. The 4 GiB default matches
# the upstream osd_memory_target default that the legacy ceph.conf
# template implicitly relied on.
ceph_osd_memory_target_autotune: false
ceph_osd_memory_target: 4294967296

# CPU isolation for the Ceph slice (see cephadm-cpuset.yml). On hyperconverged
# hosts, VM vCPU threads that spin in non-preemptible memory reclaim starve
# colocated OSD threads and cause storage pauses. Hard-partition the host with
# cgroup v2 AllowedCPUs so Ceph daemons get cores that no VM (machine.slice)
# can touch.
#
# Off by default: the ranges are host-specific and MUST be exact complements
# over the host's full CPU list -- anything else either leaves cores unused or
# lets VMs back onto Ceph's cores. Set both per host/group, keeping SMT
# siblings together (on many EPYC parts sibling of core N is N + nproc/2).
# Example, reserving 12 physical cores on a 192-thread host:
#   ceph_cpu_isolation: true
#   ceph_reserved_cpus: "0-11,96-107"
#   ceph_vm_cpus: "12-95,108-191"
ceph_cpu_isolation: false
ceph_reserved_cpus: ""
ceph_vm_cpus: ""

# machine.slice VM memory cap (see cephadm-mem-guard.yml). Reserves host+Ceph
# RAM so VM memory exhaustion cannot drive the host into global reclaim /
# soft-lockups -- turning a whole-host outage into at most a single VM restart.
# A backstop, not a scheduler input.
#
# This is the RESERVE -- what is held back for the host and Ceph. The cap is
# derived from each host's own MemTotal:
#
#     MemoryMax = MemTotal - ceph_host_memory_reserve
#
# so one value means the same thing on any host size. Applied as a hard cap
# only; no MemoryHigh throttle band (see cephadm-mem-guard.yml for why).
#
# Off by default: the size is deployment-specific. Size from the measured
# *unreclaimable* non-VM floor (daemon anon + kernel slab), NOT
# system.slice memory.current -- most of which is reclaimable page cache.
# Reserve = hard floor + Ceph recovery/backfill headroom + a free buffer.
# Nodes with extra colocated services need a larger reserve, so set this
# per host/group. systemd-style size, 1024-based.
# Example:
#   ceph_vm_memory_guard: true
#   ceph_host_memory_reserve: "128G"
ceph_vm_memory_guard: false
ceph_host_memory_reserve: ""

ceph_container_registry: "quay.io"
ceph_container_registry_user: ""
ceph_container_registry_password: ""
